<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dictus · App Store screenshots 2.0 (Direction B, Panorama)</title>
<!--
  Dictus App Store screenshot template, 2.0 (issue #643, Direction B "Panorama").
  The 1.7.1 template (#189) is in git history: e5018943:assets/appstore/screenshots.html.

  ONE scene, 6 × 1320 = 7920 px wide, 2868 px tall. Every element is placed in
  strip coordinates; the exporter cuts the strip into six 1320×2868 PNGs. That is
  what makes the set continuous: the background, the colour transitions and the
  waveform are one drawing, not six that happen to line up.

  Parameters (query string):
    ?locale=en-GB     copy from strings/<locale>.js, captures from captures/<locale>/
    ?theme=navy       background of the Pro slides: navy | light (the ONE variable
                      decision 1 asks for; the layout is identical in both)
    ?preview          scale the strip to the window

  Layout lives here (SLIDES below). Copy lives in strings/<locale>.js. Captures
  live in captures/<locale>/. Adding a locale = a strings file + its captures.

  Device frame: Apple's official iPhone 17 Pro Max bezel (Apple Design
  Resources). Its license forbids redistribution, so it is NOT in git: run
  `npm run bezel` (tools/fetch-bezel.sh) once per machine.

  Export: `npm run export` (tools/export.mjs, headless Playwright).

  Locked constraints (#189, #643): waveform = BrandWaveform.swift
  processingEnergy, blue at panel centres and never at seams; no callout pills;
  no app icon, no logo (#636); a visible Pro badge on every Pro slide.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,300..600&display=block" rel="stylesheet">
<style>
  :root {
    --panel-w: 1320px;
    --panel-h: 2868px;
    --navy: #0A1628;
    --accent: #3D7EFF;
    --accent-deep: #2563EB;
    --highlight: #6BA3FF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #06090f; }

  #strip {
    position: relative;
    width: calc(var(--panel-w) * 6);
    height: var(--panel-h);
    overflow: hidden;
    transform-origin: top left;
  }
  #bg { position: absolute; inset: 0; }

  /* ── Copy ───────────────────────────────────── */
  .copy {
    position: absolute;
    top: 196px;
    width: var(--panel-w);
    padding: 0 110px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 38px;
    z-index: 3;
  }
  .eyebrow-row { display: flex; align-items: center; gap: 22px; height: 64px; }
  .eyebrow {
    font-family: "DM Mono", monospace;
    font-weight: 500;
    font-size: 38px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--eyebrow);
  }
  /* The Pro badge: a label, flush with the eyebrow, not a callout over the UI. */
  .pro {
    font-family: "DM Sans", sans-serif;
    font-weight: 600;
    font-size: 36px;
    letter-spacing: 0.02em;
    line-height: 1;
    color: #fff;
    padding: 13px 24px 14px;
    border-radius: 16px;
    background: linear-gradient(135deg, #6BA3FF 0%, #2563EB 100%);
    box-shadow: 0 10px 28px rgba(37, 99, 235, 0.35);
  }
  .headline {
    font-family: "DM Sans", sans-serif;
    font-weight: 350;
    font-size: 112px;
    line-height: 1.06;
    letter-spacing: -0.035em;
    color: var(--ink);
    text-wrap: balance;
  }
  .subtext {
    font-family: "DM Sans", sans-serif;
    font-weight: 400;
    font-size: 44px;
    line-height: 1.42;
    max-width: 1060px;
    color: var(--sub);
    text-wrap: balance;
  }
  .free { --ink: #0A1628; --sub: rgba(10, 22, 40, 0.62); --eyebrow: #2563EB; }
  .pro-slide { --ink: var(--pro-ink); --sub: var(--pro-sub); --eyebrow: var(--pro-eyebrow); }

  /* ── Device: real Apple bezel over the capture ───── */
  .device {
    position: absolute;
    z-index: 2;
    aspect-ratio: 1470 / 3000;
    transform-style: preserve-3d;
    filter: drop-shadow(0 70px 90px var(--shadow)) drop-shadow(0 18px 30px var(--shadow-near));
  }
  .device .screen {
    position: absolute;
    /* The bezel PNG's screen opening: 1320×2868 at (75, 66) in a 1470×3000 image. */
    left: calc(75 / 1470 * 100%);
    top: calc(66 / 3000 * 100%);
    width: calc(1320 / 1470 * 100%);
    height: calc(2868 / 3000 * 100%);
    object-fit: cover;
    /* Only has to stay inside the phone body: the opaque bezel covers the rest. */
    border-radius: 13% / 6%;
  }
  .device .bezel { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* ── Keyboard cards (slide 4): real captures cropped to the keyboard ── */
  .kb {
    position: absolute;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 22px;
    align-items: flex-start;
  }
  .kb .label {
    font-family: "DM Mono", monospace;
    font-weight: 500;
    font-size: 34px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #2563EB;
    padding-left: 8px;
  }
  .kb .crop {
    overflow: hidden;
    border-radius: 54px;
    box-shadow: 0 50px 90px rgba(10, 22, 40, 0.20), 0 12px 26px rgba(10, 22, 40, 0.10),
                0 0 0 2px rgba(255, 255, 255, 0.9);
    background: #fff;
  }
  .kb .crop img { display: block; }

  .missing {
    position: absolute; inset: 0; z-index: 10; display: none;
    align-items: center; justify-content: center; text-align: center;
    font: 600 120px/1.3 "DM Sans", sans-serif; color: #EF4444; background: rgba(255,255,255,0.9);
  }

  body.preview { padding: 24px; }
</style>
</head>
<body>
<div id="strip">
  <canvas id="bg"></canvas>
  <div class="missing" id="missing">Bezel missing<br>run: npm run bezel</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const LOCALE = params.get("locale") || "en-GB";
const THEME = params.get("theme") || "navy";
document.write(`<script src="strings/${LOCALE}.js"><\/script>`);
</script>
<script>
/* ════════════════════════════════════════════════════════════
   THEMES: the Pro slides' background is the only thing that changes.
   ════════════════════════════════════════════════════════════ */
const THEMES = {
  navy: {
    proTop: [13, 32, 64],      // #0D2040, brand icon gradient start
    proBottom: [7, 16, 32],    // #071020, brand icon gradient end
    proInk: "#FFFFFF",
    proSub: "rgba(255, 255, 255, 0.70)",
    proEyebrow: "#6BA3FF",
    proDot: "rgba(255, 255, 255, 0.05)",
    proEdgeRGB: [150, 170, 205],
    proShadow: "rgba(0, 0, 0, 0.55)",
  },
  light: {
    proTop: [236, 242, 255],   // #ECF2FF
    proBottom: [214, 226, 250],// #D6E2FA
    proInk: "#0A1628",
    proSub: "rgba(10, 22, 40, 0.62)",
    proEyebrow: "#2563EB",
    proDot: "rgba(37, 99, 235, 0.07)",
    proEdgeRGB: [110, 122, 145],
    proShadow: "rgba(10, 22, 40, 0.26)",
  },
};
const T = THEMES[THEME] || THEMES.navy;
const FREE = {
  top: [245, 247, 251],        // #F5F7FB
  bottom: [231, 236, 245],     // #E7ECF5
  dot: "rgba(10, 22, 40, 0.05)",
  edgeRGB: [110, 122, 145],
  shadow: "rgba(10, 22, 40, 0.26)",
};
const root = document.documentElement.style;
root.setProperty("--pro-ink", T.proInk);
root.setProperty("--pro-sub", T.proSub);
root.setProperty("--pro-eyebrow", T.proEyebrow);

/* ════════════════════════════════════════════════════════════
   SLIDES: layout only. Copy comes from strings/<locale>.js.
   x / top / width are in strip coordinates (panel i starts at i × 1320).
   ════════════════════════════════════════════════════════════ */
const PANEL_W = 1320, PANEL_H = 2868, PANELS = 6, STRIP_W = PANEL_W * PANELS;
const BEZEL = ".bezels/iPhone 17 Pro Max - Deep Blue - Portrait.png";

const SLIDES = [
  { id: "01-dictate", key: "dictate", pro: false,
    devices: [{ capture: "01-recording-messages.png", cx: 660, top: 790, width: 1040, tilt: 7 }] },
  { id: "02-smart-modes", key: "smartModes", pro: true,
    devices: [{ capture: "02-smart-mode-fan.png", cx: 660, top: 790, width: 1040, tilt: -7 }] },
  { id: "03-voice-notes", key: "voiceNotes", pro: true,
    devices: [{ capture: "03-voice-note-reader.png", cx: 660, top: 790, width: 1040, tilt: 7 }] },
  { id: "04-keyboard", key: "keyboard", pro: false,
    keyboards: [
      { capture: "04-keyboard-azerty-fr.png", label: "fr" },
      { capture: "04-keyboard-qwerty-en.png", label: "en" },
      { capture: "04-keyboard-qwertz-de.png", label: "de" },
    ] },
  { id: "05-private", key: "private", pro: false,
    devices: [{ capture: "05-offline-reminders.png", cx: 660, top: 790, width: 1040, tilt: -7 }] },
  { id: "06-languages", key: "languages", pro: false,
    devices: [
      { capture: "06-whisper-languages.png", cx: 985, top: 900, width: 640, tilt: -10, z: 1 },
      { capture: "06-parakeet-languages.png", cx: 335, top: 900, width: 640, tilt: 10, z: 2 },
    ] },
];

/* Captures: the locale's own folder, else en-GB. A missing file falls back once. */
function captureSrc(file) { return `captures/${LOCALE}/${file}`; }
function fallback(img, file) {
  img.onerror = null;
  img.src = `captures/en-GB/${file}`;
}

const S = window.DICTUS_STRINGS;
const strip = document.getElementById("strip");

function addDevice(d, panelIndex, pro) {
  const el = document.createElement("div");
  el.className = "device";
  const x = panelIndex * PANEL_W + d.cx - d.width / 2;
  el.style.left = `${x}px`;
  el.style.top = `${d.top}px`;
  el.style.width = `${d.width}px`;
  if (d.z) el.style.zIndex = 2 + d.z;
  el.style.transform = `perspective(5200px) rotateY(${d.tilt || 0}deg)`;
  el.style.setProperty("--shadow", pro ? T.proShadow : FREE.shadow);
  el.style.setProperty("--shadow-near", pro ? T.proShadow : "rgba(10, 22, 40, 0.12)");
  el.innerHTML = `<img class="screen" alt=""><img class="bezel" alt="">`;
  const screen = el.querySelector(".screen");
  screen.onerror = () => fallback(screen, d.capture);
  screen.src = captureSrc(d.capture);
  const bezel = el.querySelector(".bezel");
  bezel.onerror = () => { document.getElementById("missing").style.display = "flex"; };
  bezel.src = BEZEL;
  strip.appendChild(el);
}

/* Slide 4: the keyboard band of each capture (toolbar + keys), stacked. */
const KB_CROP = { y: 1770, h: 880 };   // capture pixels: suggestion bar to the space row
const KB_SCALE = 0.64;
function addKeyboards(list, panelIndex, labels) {
  const w = Math.round(PANEL_W * KB_SCALE), h = Math.round(KB_CROP.h * KB_SCALE);
  list.forEach((k, i) => {
    const el = document.createElement("div");
    el.className = "kb";
    // A gentle cascade: alternating offsets read as three objects, not a list.
    const dx = [-70, 70, -70][i];
    el.style.left = `${panelIndex * PANEL_W + (PANEL_W - w) / 2 + dx}px`;
    el.style.top = `${770 + i * (h + 112)}px`;
    el.innerHTML = `<div class="label">${labels[k.label]}</div>
      <div class="crop" style="width:${w}px;height:${h}px">
        <img alt="" style="width:${w}px;margin-top:${-KB_CROP.y * KB_SCALE}px">
      </div>`;
    const img = el.querySelector("img");
    img.onerror = () => fallback(img, k.capture);
    img.src = captureSrc(k.capture);
    strip.appendChild(el);
  });
}

SLIDES.forEach((s, i) => {
  const copy = S.slides[s.key];
  const c = document.createElement("div");
  c.className = `copy ${s.pro ? "pro-slide" : "free"}`;
  c.style.left = `${i * PANEL_W}px`;
  c.innerHTML = `
    <div class="eyebrow-row">
      <span class="eyebrow">${copy.eyebrow}</span>
      ${s.pro ? `<span class="pro">${S.proBadge}</span>` : ""}
    </div>
    <div class="headline">${copy.headline}</div>
    <div class="subtext">${copy.subtext}</div>`;
  strip.appendChild(c);
  (s.devices || []).forEach((d) => addDevice(d, i, s.pro));
  if (s.keyboards) addKeyboards(s.keyboards, i, copy.labels);
});

/* ════════════════════════════════════════════════════════════
   Background + continuous waveform, drawn once across the strip.
   ════════════════════════════════════════════════════════════ */
const canvas = document.getElementById("bg");
canvas.width = STRIP_W;
canvas.height = PANEL_H;
const ctx = canvas.getContext("2d");

/* How "Pro" a column is, 0..1. TRANSITION is the half-width of the light/Pro
   blend around a seam. 0 = a clean change exactly at the cut (issue #643: "the
   navy-to-light transition happens at the slide 1 to 2 cut"); a soft blend was
   tried at 300 and 160 px and read as a stain on the edge of a standalone slide. */
const TRANSITION = 0;
const smooth = (t) => t * t * (3 - 2 * t);
function proWeight(x) {
  const edges = [];
  SLIDES.forEach((s, i) => {
    const prev = SLIDES[i - 1];
    if (prev && prev.pro !== s.pro) edges.push({ at: i * PANEL_W, entering: s.pro });
  });
  let w = SLIDES[Math.min(Math.floor(x / PANEL_W), PANELS - 1)].pro ? 1 : 0;
  for (const e of edges) {
    const d = x - e.at;
    if (TRANSITION > 0 && Math.abs(d) < TRANSITION) {
      const t = smooth((d + TRANSITION) / (2 * TRANSITION));
      w = e.entering ? t : 1 - t;
    }
  }
  return w;
}
const mix = (a, b, t) => a.map((v, k) => Math.round(v + (b[k] - v) * t));

for (let x = 0; x < STRIP_W; x += 2) {
  const t = proWeight(x + 1);
  const g = ctx.createLinearGradient(0, 0, 0, PANEL_H);
  g.addColorStop(0, `rgb(${mix(FREE.top, T.proTop, t)})`);
  g.addColorStop(1, `rgb(${mix(FREE.bottom, T.proBottom, t)})`);
  ctx.fillStyle = g;
  ctx.fillRect(x, 0, 2, PANEL_H);
}

/* Dot grid, uniform spacing so it never shows a seam. */
const DOT = 64;
for (let gy = DOT / 2; gy < PANEL_H; gy += DOT) {
  for (let gx = DOT / 2; gx < STRIP_W; gx += DOT) {
    ctx.fillStyle = proWeight(gx) > 0.5 ? T.proDot : FREE.dot;
    ctx.beginPath();
    ctx.arc(gx, gy, 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* Waveform: BrandWaveform.swift processingEnergy,
     energy = 0.2 + 0.25 * (sin(2π · t) + 1)
   one continuous function over the whole strip. Colour follows the app's rule:
   the inner 40 % of every PANEL is the blue gradient, the rest fades to grey,
   so blue sits at each screen's centre and never on a seam. */
const BAR_W = 30, BAR_GAP = 16, MIN_H = 14, MAX_H = 560;
const WAVE_Y = 2400;
const WAVE_PERIOD = STRIP_W / 4;
const pitch = BAR_W + BAR_GAP;
const bars = Math.floor((STRIP_W - BAR_GAP) / pitch);
const x0 = (STRIP_W - (bars * pitch - BAR_GAP)) / 2;
ctx.globalAlpha = 0.62;
for (let i = 0; i < bars; i++) {
  const x = x0 + i * pitch, cx = x + BAR_W / 2;
  const energy = 0.2 + 0.25 * (Math.sin(2 * Math.PI * (cx / WAVE_PERIOD + 0.25)) + 1);
  const h = Math.max(MIN_H + energy * (MAX_H - MIN_H), MIN_H);
  const y = WAVE_Y - h / 2;
  const p = Math.min(Math.floor(cx / PANEL_W), PANELS - 1);
  const dCenter = Math.abs(cx - (p * PANEL_W + PANEL_W / 2)) / (PANEL_W / 2);
  let fill;
  if (dCenter < 0.4) {
    fill = ctx.createLinearGradient(0, y, 0, y + h);
    fill.addColorStop(0, "#6BA3FF");
    fill.addColorStop(1, "#2563EB");
  } else {
    const rgb = mix(FREE.edgeRGB, T.proEdgeRGB, proWeight(cx));
    fill = `rgba(${rgb},${((1 - dCenter) * 0.9 + 0.15).toFixed(3)})`;
  }
  ctx.beginPath();
  ctx.roundRect(x, y, BAR_W, h, BAR_W / 2);
  ctx.fillStyle = fill;
  ctx.fill();
}
ctx.globalAlpha = 1;

/* Signals the exporter waits for: every image decoded, fonts loaded. */
window.whenReady = Promise.all([
  document.fonts.ready,
  ...[...document.images].map((im) => im.decode().catch(() => new Promise((r) => {
    im.addEventListener("load", r, { once: true });
    im.addEventListener("error", r, { once: true });
  }))),
]).then(() => document.getElementById("missing").style.display !== "flex");
window.SLIDE_IDS = SLIDES.map((s) => s.id);

if (params.has("preview")) {
  document.body.classList.add("preview");
  const fit = () => {
    const scale = (window.innerWidth - 48) / STRIP_W;
    strip.style.transform = `scale(${scale})`;
    document.body.style.height = `${PANEL_H * scale + 60}px`;
  };
  fit();
  window.addEventListener("resize", fit);
}
</script>
</body>
</html>
