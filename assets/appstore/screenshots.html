<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dictus · App Store screenshots 2.0 (Direction B, Panorama, iteration 2)</title>
<!--
  Dictus App Store screenshot template, 2.0 (issue #643, Direction B "Panorama",
  design iteration 2). Iteration 1 is commit 171c93b0; the 1.7.1 template is
  e5018943.

  ONE scene, 6 × 1320 = 7920 px wide, 2868 px tall. Every element is placed in
  strip coordinates; the exporter cuts the strip into six 1320×2868 PNGs, so the
  background, the colour change at the Pro slides and the waveform are one
  drawing, not six that happen to line up.

  Iteration 2, after studying the Wispr Flow, Superwhisper and Typeless sets:
  - one short headline per slide (no subtitle); at most one small footnote where
    honesty needs it (Apple Intelligence, the language counts);
  - a different screen on every slide;
  - bigger phones, cropped by the bottom edge;
  - the point of the slide lifted out of the phone, enlarged: a crop of the
    real capture ("lift"), or a card that shows content the product produces
    (Smart Mode before/after, measured). Neither is a label pinned on the UI.

  Parameters (query string):
    ?locale=en-GB     copy from strings/<locale>.js, captures from captures/<locale>/
    ?theme=light      background of the Pro slides: light (default since V3) | navy.
                      The ONE variable decision 1 asks for; the layout is identical.
    ?variant=translate  slide 2 sells `translate` (default, chosen by Pierre) or `message`
    ?preview          scale the strip to the window

  Device frame: Apple's official iPhone 17 Pro Max bezel (Apple Design
  Resources). Its license forbids redistribution, so it is NOT in git: run
  `npm run bezel` (tools/fetch-bezel.sh) once per machine.
  Export: `npm run export` (tools/export.mjs, headless Playwright).

  Locked constraints (#189, #643): waveform = BrandWaveform.swift
  processingEnergy, blue at panel centres and never at seams; no callout pills;
  no app icon, no logo (#636); a visible Pro badge on every Pro slide.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,300..600&display=block" rel="stylesheet">
<style>
  :root { --panel-w: 1320px; --panel-h: 2868px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #06090f; }
  #strip { position: relative; width: calc(var(--panel-w) * 6); height: var(--panel-h); overflow: hidden; transform-origin: top left; }
  #bg { position: absolute; inset: 0; }

  .free { --ink: #0A1628; --sub: rgba(10, 22, 40, 0.55); }
  .pro-slide { --ink: var(--pro-ink); --sub: var(--pro-sub); }

  /* ── Headline: the only text a slide needs ───────── */
  .copy {
    position: absolute; top: 150px; width: var(--panel-w); padding: 0 90px;
    display: flex; flex-direction: column; align-items: center; text-align: center; z-index: 6;
  }
  .badge-row { height: 92px; display: flex; align-items: flex-start; }
  .pro {
    font: 600 40px/1 "DM Sans", sans-serif; letter-spacing: 0.02em; color: #fff;
    padding: 15px 30px 16px; border-radius: 18px;
    background: linear-gradient(135deg, #3D7EFF 0%, #2563EB 100%);   /* white text stays legible */
    box-shadow: 0 12px 30px rgba(37, 99, 235, 0.35);
  }
  .headline {
    font-family: "DM Sans", sans-serif; font-weight: 400; font-size: 146px; line-height: 1.0;
    letter-spacing: -0.045em; color: var(--ink); text-wrap: balance; max-width: 1160px;
  }
  .footnote {
    margin-top: 34px; font: 400 38px/1.3 "DM Sans", sans-serif; color: var(--sub);
    letter-spacing: -0.005em;
  }

  /* ── Device: real Apple bezel over the capture ───── */
  .device {
    position: absolute; z-index: 2; aspect-ratio: 1470 / 3000;
    filter: drop-shadow(0 60px 90px var(--shadow)) drop-shadow(0 16px 28px var(--shadow-near));
  }
  .device .screen {
    position: absolute;
    /* The bezel PNG's screen opening: 1320×2868 at (75, 66) in a 1470×3000 image. */
    left: calc(75 / 1470 * 100%); top: calc(66 / 3000 * 100%);
    width: calc(1320 / 1470 * 100%); height: calc(2868 / 3000 * 100%);
    border-radius: 13% / 6%; overflow: hidden;
  }
  .device .screen > img { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* Overlays drawn in capture pixels (1320×2868), scaled with the screen. */
  .device .layer { position: absolute; left: 0; top: 0; width: 1320px; height: 2868px; transform-origin: 0 0; }
  .device .bezel { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* ── Lift: a crop of the real capture, enlarged, floating over the phone ── */
  .lift {
    position: absolute; z-index: 4; overflow: hidden; background: #fff;
    border-radius: 64px;
    box-shadow: 0 70px 120px var(--lift-shadow), 0 18px 36px rgba(10, 22, 40, 0.14),
                0 0 0 2px rgba(255, 255, 255, 0.85);
  }
  .lift img { position: absolute; display: block; }

  /* ── Smart Mode before / after card ─────────────── */
  .ba {
    position: absolute; z-index: 4; border-radius: 64px; padding: 64px 70px 70px;
    background: #FFFFFF;
    box-shadow: 0 70px 120px var(--lift-shadow), 0 18px 36px rgba(10, 22, 40, 0.14);
    font-family: "DM Sans", sans-serif; color: #0A1628;
  }
  .ba .label { font: 500 34px/1 "DM Mono", monospace; letter-spacing: 0.1em; text-transform: uppercase; color: #6B7A90; }
  .ba .before { margin-top: 26px; font-size: 48px; line-height: 1.38; color: #4A5568; letter-spacing: -0.01em; }
  .ba .before s { text-decoration: line-through; text-decoration-thickness: 4px; text-decoration-color: #EF4444; color: #A0AEC0; }
  .ba .divider { display: flex; align-items: center; gap: 24px; margin: 46px 0 40px; }
  .ba .divider::before, .ba .divider::after { content: ""; flex: 1; height: 3px; background: #E2E8F0; border-radius: 2px; }
  .ba .mode {
    display: flex; align-items: center; gap: 16px; padding: 16px 30px; border-radius: 40px;
    font: 500 40px/1 "DM Sans", sans-serif; color: #fff;
    /* Dictus blue: there is no purple in the app. Accent #3D7EFF to #2563EB rather
       than the brand gradient's #6BA3FF, so white text keeps a 3:1 contrast. */
    background: linear-gradient(135deg, #3D7EFF 0%, #2563EB 100%);
    box-shadow: 0 10px 24px rgba(37, 99, 235, 0.35);
  }
  .ba .mode svg { width: 40px; height: 40px; }
  .ba .after { display: flex; flex-direction: column; gap: 22px; }
  .ba .after p { font-size: 54px; line-height: 1.32; letter-spacing: -0.015em; color: #0A1628; font-weight: 450; }

  /* ── Slide 1: a generic email compose screen, drawn in capture pixels ──
     Dictation saves the most time on long text, and an email differs from the
     chats of slides 2 and 3. The simulator has no Mail app, and copying Apple
     Mail, Gmail or Outlook would be someone else's trade dress, so this is an
     unbranded compose screen in Dictus's restrained style. It stops above the
     keyboard panel's own shadow; the status bar and the recording panel stay real. */
  .compose-screen {
    position: absolute; left: 0; top: 150px; width: 1320px; height: 1590px; background: #FFFFFF;
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; color: #0A1628;
  }
  .compose-screen .bar {
    height: 190px; display: flex; align-items: center; justify-content: space-between; padding: 0 56px;
  }
  .compose-screen .bar .close { width: 46px; height: 46px; }
  .compose-screen .bar .send {
    width: 104px; height: 104px; border-radius: 50%; background: #3D7EFF; display: flex;
    align-items: center; justify-content: center;
  }
  .compose-screen .bar .send svg { width: 50px; height: 50px; }
  .compose-screen .field {
    margin: 0 56px; height: 128px; display: flex; align-items: center; gap: 26px;
    border-bottom: 2px solid #ECEEF3; font-size: 48px;
  }
  .compose-screen .field .label { color: #8A94A6; }
  .compose-screen .field .chip {
    padding: 14px 30px; border-radius: 40px; background: #E6EEFF; color: #2563EB; font-weight: 500;
  }
  .compose-screen .field.subject { font-weight: 600; }
  .compose-screen .body { margin: 54px 56px 0; font-size: 50px; line-height: 1.45; }
  .compose-screen .body p + p { margin-top: 40px; }
  .compose-screen .caret {
    display: inline-block; width: 5px; height: 62px; margin-left: 4px; vertical-align: -12px;
    background: #3D7EFF; border-radius: 3px;
  }

  /* ── Slide 3: a generic chat screen, drawn in capture pixels ──
     Voice notes reach Dictus from chat apps through the share sheet (#620), but
     WhatsApp and Telegram do not install on the simulator, and drawing either
     would be third-party trade dress in App Store metadata (guideline 5.2). Apple
     Messages is the wrong host too: iOS already transcribes its audio messages.
     So the conversation is an unbranded chat in Dictus's own restrained style:
     no Apple header or bubble colours, no WhatsApp/Telegram wallpaper, header or
     green. The status bar above and the keyboard reader below stay real. */
  .chat {
    position: absolute; left: 0; top: 150px; width: 1320px; height: 1617px; background: #FFFFFF;
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; color: #0A1628;
  }
  .chat .head {
    position: absolute; left: 0; right: 0; top: 0; height: 236px; display: flex; align-items: center;
    gap: 34px; padding: 0 56px; border-bottom: 2px solid #ECEEF3;
  }
  .chat .head svg { width: 44px; height: 44px; flex: none; }
  .chat .avatar {
    width: 116px; height: 116px; border-radius: 50%; flex: none; display: flex; align-items: center;
    justify-content: center; background: #E4ECFF; color: #2563EB; font-size: 54px; font-weight: 600;
  }
  .chat .name { font-size: 56px; font-weight: 600; letter-spacing: -0.01em; }
  .chat .day { position: absolute; left: 0; right: 0; top: 300px; text-align: center; font-size: 36px; color: #8A94A6; }
  .chat .out {
    position: absolute; right: 56px; top: 390px; max-width: 860px; padding: 30px 42px;
    border-radius: 46px 46px 14px 46px; background: #E6EEFF; font-size: 48px; line-height: 1.3;
  }
  .chat .voice {
    position: absolute; left: 56px; top: 640px; width: 760px; height: 150px; padding: 0 44px 0 26px;
    display: flex; align-items: center; gap: 30px; border-radius: 46px 46px 46px 14px; background: #F1F3F7;
  }
  .chat .voice .play { width: 100px; height: 100px; flex: none; }
  .chat .voice .bars { display: flex; align-items: center; gap: 8px; flex: 1; height: 80px; }
  .chat .voice .bars i { display: block; width: 8px; border-radius: 4px; background: #9AA3B5; }
  .chat .voice .dur { font-size: 40px; color: #5B6577; font-variant-numeric: tabular-nums; }
  .chat .compose {
    position: absolute; left: 56px; right: 56px; top: 1470px; height: 112px; border-radius: 56px;
    background: #F1F3F7; display: flex; align-items: center; padding: 0 44px; font-size: 46px; color: #9AA3B5;
  }

  /* ── Keyboard cards (slide 4): real captures cropped to the keyboard ── */
  .kb { position: absolute; z-index: 3; }
  .kb .crop {
    position: relative; overflow: hidden; border-radius: 60px; background: #fff;
    box-shadow: 0 50px 90px rgba(10, 22, 40, 0.20), 0 12px 26px rgba(10, 22, 40, 0.10),
                0 0 0 2px rgba(255, 255, 255, 0.9);
  }
  .kb .crop img { position: absolute; display: block; }
  .kb .tag {
    position: absolute; top: -34px; z-index: 2; padding: 16px 28px; border-radius: 22px;
    font: 500 34px/1 "DM Mono", monospace; letter-spacing: 0.08em; text-transform: uppercase;
    color: #fff; background: #0A1628; box-shadow: 0 10px 24px rgba(10, 22, 40, 0.25);
  }

  /* ── Greetings field (slide 6) ─────────────────── */
  /* Fallback order matters: Hiragino carries Cyrillic and Greek in full-width
     glyphs, so Helvetica Neue must come before it. */
  .greet {
    position: absolute; z-index: 3; width: 1220px; display: flex; flex-wrap: wrap;
    justify-content: center; align-items: baseline; column-gap: 54px; row-gap: 26px;
    font-family: "DM Sans", "Helvetica Neue", "Hiragino Sans", "Apple SD Gothic Neo", "Geeza Pro", sans-serif;
    letter-spacing: -0.025em; line-height: 1.15;
  }

  /* ── Hero (slide 1, V4) ─────────────────────────── */
  .hero-brand { position: absolute; top: 150px; z-index: 6; display: flex; align-items: center; gap: 26px; }
  .hero-brand .bars { width: 92px; height: 92px; }
  .hero-brand span { font: 200 104px/1 "DM Sans", sans-serif; letter-spacing: -0.04em; color: #0A1628; }
  .hero-headline {
    position: absolute; top: 330px; z-index: 6; width: 1110px;
    font: 400 168px/0.98 "DM Sans", sans-serif; letter-spacing: -0.045em; color: #0A1628; text-wrap: balance;
  }
  .hero-illu { position: absolute; z-index: 3; }
  .ribbon-icon {
    position: absolute; z-index: 8; overflow: hidden; border-radius: 22.4%;
    box-shadow: 0 18px 36px rgba(10, 22, 40, 0.22), 0 4px 10px rgba(10, 22, 40, 0.10);
    display: flex; align-items: center; justify-content: center;
  }
  .ribbon-icon img { width: 100%; height: 100%; display: block; }
  .ribbon-icon svg { width: 54%; height: 54%; }

  .missing { position: absolute; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; text-align: center; font: 600 120px/1.3 "DM Sans", sans-serif; color: #EF4444; background: rgba(255,255,255,0.9); }
  body.preview { padding: 24px; }
</style>
</head>
<body>
<div id="strip">
  <canvas id="bg"></canvas>
  <div class="missing" id="missing">Bezel missing<br>run: npm run bezel</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const LOCALE = params.get("locale") || "en-GB";
const THEME = params.get("theme") || "light";
/* The Smart Mode slide sells one mode: ?smart=translate (default, Pierre's choice,
   2026-10-05) or message. ?variant= is the V3 name of the same switch. */
const VARIANT = params.get("smart") || params.get("variant") || "translate";
/* The app-icon ribbon of slides 1 and 2: ?ribbon=logos (default, real icons) or
   tiles (neutral Dictus-blue tiles, the fallback if App Review objects, 5.2). */
const RIBBON = params.get("ribbon") || "logos";
const NOLOGO = RIBBON === "tiles" ? "-nologos" : "";
/* The hero's illustration style (V5): ?hero=comic (marker comic, default) or paper
   (cut-paper collage). Both are drawn in code with anidoodle (art/v5/). */
const HERO = params.get("hero") || "comic";
/* V6: the hero canvas spans slides 1 and 2 (marker comic), so the voice strokes can reach
   slide 2's recording panel. V7: ?cast=woman-curves (default) | woman | man picks the
   character (art/v7/). */
const CAST = params.get("cast") || "woman-curves";
window.ITERATION_CAST = true;   // V7: slide 2's file name carries the character (its stroke ends differ)
document.write(`<script src="strings/${LOCALE}.js"><\/script>`);
</script>
<script>
/* ════════════════════════════════════════════════════════════
   THEMES: the Pro slides' background is the only thing that changes.
   ════════════════════════════════════════════════════════════ */
const THEMES = {
  navy: {
    proTop: [13, 32, 64], proBottom: [7, 16, 32],          // brand icon gradient #0D2040 → #071020
    proInk: "#FFFFFF", proSub: "rgba(255, 255, 255, 0.62)",
    proDot: "rgba(255, 255, 255, 0.05)", proEdgeRGB: [150, 170, 205],
    proShadow: "rgba(0, 0, 0, 0.55)", proLift: "rgba(0, 0, 0, 0.55)",
  },
  light: {
    proTop: [228, 237, 255], proBottom: [203, 219, 250],    // #E4EDFF → #CBDBFA: a shade deeper than the free slides
    proInk: "#0A1628", proSub: "rgba(10, 22, 40, 0.55)",
    proDot: "rgba(37, 99, 235, 0.07)", proEdgeRGB: [110, 122, 145],
    proShadow: "rgba(10, 22, 40, 0.26)", proLift: "rgba(10, 22, 40, 0.28)",
  },
};
const T = THEMES[THEME] || THEMES.navy;
const FREE = {
  top: [245, 247, 251], bottom: [231, 236, 245],            // #F5F7FB → #E7ECF5
  dot: "rgba(10, 22, 40, 0.05)", edgeRGB: [110, 122, 145],
  shadow: "rgba(10, 22, 40, 0.26)", lift: "rgba(10, 22, 40, 0.28)",
};
const rootStyle = document.documentElement.style;
rootStyle.setProperty("--pro-ink", T.proInk);
rootStyle.setProperty("--pro-sub", T.proSub);

const PANEL_W = 1320, PANEL_H = 2868;   // PANELS and STRIP_W follow SLIDES, below
const BEZEL = ".bezels/iPhone 17 Pro Max - Deep Blue - Portrait.png";

/* Phone geometry shared by every phone slide: the WHOLE phone, same size and
   baseline everywhere, with a margin below. Dictus is a keyboard and the keyboard
   is the bottom of the screen: a bottom crop hid the product (V2). */
const PHONE = { width: 1000, top: 737 };   // 2041 px tall, 90 px margin below
/* Keyboard band of a capture, in capture pixels: from the top edge of the
   keyboard panel to just under the space row. Measured on the captures
   (2026-10-05): the panel starts at y = 1767, spans the full width, and its top
   corners have a radius of about 85 px (circle fit, 84.4 to 86.5 across three
   captures). The band starts exactly on that edge, so a lifted card with
   radius 85 × zoom has the panel's own corners as its top corners. */
const PANEL_RADIUS = 85;
const KEYBOARD_BAND = { y: 1767, h: 891, radius: PANEL_RADIUS, fill: "#E2E3E7" };

/* ════════════════════════════════════════════════════════════
   SLIDES: layout only. Copy comes from strings/<locale>.js.
   ════════════════════════════════════════════════════════════ */
const SLIDES = [
  // V4: a hero with no phone. Illustration, brand, headline; the voice becomes the
  // BrandWaveform and the app-icon ribbon, which cross the cut into slide 2 together.
  { id: `01-hero-${CAST}${NOLOGO}`, key: "hero", pro: false, hero: true },
  { id: `02-dictate${window.ITERATION_CAST ? `-${CAST}` : ""}${NOLOGO}`, key: "dictate", pro: false,
    // Real capture (status bar, recording panel); the email above is drawn by composeScreen().
    // V5: smaller and higher than the other phones, so the waveform and the icon
    // ribbon run below it across the cut without touching it.
    phone: { capture: "01-recording-reminders.png", compose: true, size: { width: 840, top: 580 } },
    lift: { band: KEYBOARD_BAND, width: 1180, raise: 60 } },
  { id: `03-${VARIANT}`, key: "smartModes", pro: true,
    phone: { capture: `02-smart-mode-fan-${VARIANT}.png` },
    beforeAfter: { top: 860, width: 1180 } },
  { id: "04-voice-notes", key: "voiceNotes", pro: true,
    // Real capture (status bar, keyboard reader); the conversation above is the
    // generic chat drawn by chatScreen().
    phone: { capture: "03-voice-note-reader.png", chat: true },
    lift: { band: KEYBOARD_BAND, width: 1180, raise: 60 } },
  { id: "05-keyboard", key: "keyboard", pro: false,
    keyboards: [
      { capture: "04-keyboard-azerty-fr.png", label: "fr" },
      { capture: "04-keyboard-qwerty-en.png", label: "en" },
      { capture: "04-keyboard-qwertz-de.png", label: "de" },
    ] },
  { id: "06-private", key: "private", pro: false,
    phone: { capture: "05-models-downloaded.png" },
    // The whole "Downloaded" section: the point is that the models live on the phone.
    // Measured model cards: x 45 to 1274, radius 46.5 px (plain) and 49.9 px (the
    // active card's blue border). Cropped with a 40 px margin around them, so the
    // card's radius is the inner radius + the margin (50 + 40) and the corners
    // read as concentric.
    lift: { band: { x: 5, y: 538, w: 1309, h: 1005, radius: 90, fill: "#F0F0F5" }, width: 1180 } },
  { id: "07-languages", key: "languages", pro: false, greetings: true },
];

const PANELS = SLIDES.length, STRIP_W = PANEL_W * PANELS;

function captureSrc(file) { return `captures/${LOCALE}/${file}`; }
function loadImg(img, file) {
  img.onerror = () => { img.onerror = null; img.src = `captures/en-GB/${file}`; };
  img.src = captureSrc(file);
}

const S = window.DICTUS_STRINGS;
const strip = document.getElementById("strip");
strip.style.width = `${STRIP_W}px`;
const el = (cls, html) => { const d = document.createElement("div"); d.className = cls; if (html) d.innerHTML = html; return d; };

/* Phone; returns the capture → strip mapping so lifts can sit exactly over their source. */
function addPhone(p, i, pro) {
  const G = { ...PHONE, ...(p.size || {}) };
  const scale = G.width / 1470;                // bezel pixels → strip pixels
  const left = i * PANEL_W + (PANEL_W - G.width) / 2;
  const d = el("device");
  Object.assign(d.style, { left: `${left}px`, top: `${G.top}px`, width: `${G.width}px` });
  d.style.setProperty("--shadow", pro ? T.proShadow : FREE.shadow);
  d.style.setProperty("--shadow-near", pro ? T.proShadow : "rgba(10, 22, 40, 0.12)");
  d.innerHTML = `<div class="screen"><img alt=""><div class="layer"></div></div><img class="bezel" alt="">`;
  loadImg(d.querySelector(".screen > img"), p.capture);
  const bezel = d.querySelector(".bezel");
  bezel.onerror = () => { document.getElementById("missing").style.display = "flex"; };
  bezel.src = BEZEL;
  // The layer works in capture pixels: 1320 capture px = 1320 bezel px.
  d.querySelector(".layer").style.transform = `scale(${scale})`;
  if (p.chat) d.querySelector(".layer").appendChild(chatScreen());
  if (p.compose) d.querySelector(".layer").appendChild(composeScreen());
  strip.appendChild(d);
  // Capture pixel (x, y) → strip coordinates.
  return (x, y) => [left + (75 + x) * scale, G.top + (66 + y) * scale];
}

/* The generic email compose above the real recording panel (slide 1), in capture pixels. */
function composeScreen() {
  const e = S.slides.dictate;
  const paragraphs = e.emailBody.map((t, n) =>
    `<p>${t}${n === e.emailBody.length - 1 ? '<span class="caret"></span>' : ""}</p>`).join("");
  return el("compose-screen", `
    <div class="bar">
      <svg class="close" viewBox="0 0 24 24" fill="none" stroke="#0A1628" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
      <span class="send"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span>
    </div>
    <div class="field"><span class="label">${e.emailToLabel}</span><span class="chip">${e.emailTo}</span></div>
    <div class="field subject">${e.emailSubject}</div>
    <div class="body">${paragraphs}</div>`);
}

/* The generic chat above the real reader (slide 3), in capture pixels. */
function chatScreen() {
  const v = S.slides.voiceNotes;
  const heights = [22, 36, 54, 30, 66, 46, 74, 56, 28, 50, 70, 40, 26, 60, 44, 30, 52, 24, 38, 58, 34, 22, 44, 30];
  return el("chat", `
    <div class="head">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0A1628" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 7 12l8 8"/></svg>
      <div class="avatar">${v.contactName[0]}</div>
      <div class="name">${v.contactName}</div>
    </div>
    <div class="day">${v.chatDay}</div>
    <div class="out">${v.chatSent}</div>
    <div class="voice">
      <svg class="play" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#3D7EFF"/><path d="M41 32 L69 50 L41 68 Z" fill="#fff"/></svg>
      <span class="bars">${heights.map((h) => `<i style="height:${h}px"></i>`).join("")}</span>
      <span class="dur">${v.bubbleDuration}</span>
    </div>
    <div class="compose">${v.chatPlaceholder}</div>`);
}

/* A crop of the capture, enlarged, centred on where it sits in the phone (or at centerY). */
function addLift(l, toStrip, file, pro, i) {
  const band = { x: 0, w: 1320, ...l.band };
  const k = l.width / band.w;
  const [, y0] = toStrip(band.x, band.y);
  const [, y1] = toStrip(band.x, band.y + band.h);
  const h = band.h * k;
  // `raise` lifts the crop above its source, so it reads as coming out of the phone.
  const cy = (l.centerY ?? (y0 + y1) / 2) - (l.raise || 0);
  const d = el("lift", `<img alt="">`);
  if (band.radius) d.style.borderRadius = `${band.radius * k}px`;
  if (band.fill) d.style.background = band.fill;
  Object.assign(d.style, {
    left: `${i * PANEL_W + (PANEL_W - l.width) / 2}px`, top: `${cy - h / 2}px`,
    width: `${l.width}px`, height: `${h}px`,
  });
  d.style.setProperty("--lift-shadow", pro ? T.proLift : FREE.lift);
  const img = d.querySelector("img");
  Object.assign(img.style, { width: `${1320 * k}px`, left: `${-band.x * k}px`, top: `${-band.y * k}px` });
  loadImg(img, file);
  strip.appendChild(d);
  LIFTS[i] = { el: d, left: i * PANEL_W + (PANEL_W - l.width) / 2, top: cy - h / 2, k, band };
}

function addBeforeAfter(b, slideCopy, i, pro) {
  const copy = { ...slideCopy, ...slideCopy[VARIANT] };
  const icon = VARIANT === "translate"
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.8 2.6 15.2 0 18M12 3c-2.6 2.8-2.6 15.2 0 18"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>';
  const before = copy.before.replace(/~([^~]+)~/g, "<s>$1</s>");
  const d = el("ba", `
    <div class="label">${copy.beforeLabel}</div>
    <div class="before">${before}</div>
    <div class="divider"><span class="mode">
      ${icon}${copy.modeName}</span></div>
    <div class="after">${copy.after.map((t) => `<p>${t}</p>`).join("")}</div>`);
  Object.assign(d.style, { left: `${i * PANEL_W + (PANEL_W - b.width) / 2}px`, top: `${b.top}px`, width: `${b.width}px` });
  d.style.setProperty("--lift-shadow", pro ? T.proLift : FREE.lift);
  strip.appendChild(d);
}

function addKeyboards(list, i, labels) {
  // The suggestion bar to the space row: what a keyboard is judged on.
  // From the panel's top edge (see KEYBOARD_BAND), so the card's top corners are
  // the panel's own: radius 85 × zoom.
  const band = { y: KEYBOARD_BAND.y, h: 883 };
  // 1020 wide: three cards from the panel edge fit above the bottom margin.
  const w = 1020, k = w / 1320, h = Math.round(band.h * k);
  const tops = [640, 640 + h + 56, 640 + 2 * (h + 56)];
  list.forEach((kb, n) => {
    const d = el("kb", `<div class="tag">${labels[kb.label]}</div><div class="crop"><img alt=""></div>`);
    const dx = [-30, 30, -30][n];
    Object.assign(d.style, { left: `${i * PANEL_W + (PANEL_W - w) / 2 + dx}px`, top: `${tops[n]}px` });
    d.querySelector(".tag").style[n % 2 ? "right" : "left"] = "46px";
    const crop = d.querySelector(".crop");
    Object.assign(crop.style, { width: `${w}px`, height: `${h}px`, borderRadius: `${PANEL_RADIUS * k}px`, background: KEYBOARD_BAND.fill });
    const img = crop.querySelector("img");
    Object.assign(img.style, { width: `${1320 * k}px`, top: `${-band.y * k}px`, left: "0" });
    loadImg(img, kb.capture);
    strip.appendChild(d);
  });
}

/* Greetings: two wrapped blocks, above and below the waveform. Deterministic
   sizes and tints, so the slide looks the same on every export. */
function addGreetings(list, i) {
  const half = Math.ceil(list.length / 2);
  [[list.slice(0, half), 660], [list.slice(half), 1930]].forEach(([words, top], b) => {
    const block = el("greet", words.map(([word], n) => {
      const k = n + b;
      const strong = k % 4 === 0;
      const size = strong ? 124 : [96, 84, 104][k % 3];
      const color = strong ? "#2563EB" : `rgba(10, 22, 40, ${[0.82, 0.48, 0.64][k % 3]})`;
      const span = `<span style="font-size:${size}px;font-weight:${strong ? 500 : 400};color:${color}">${word}</span>`;
      // Three words per line: a wrap left to chance leaves one word alone on a line.
      return span + ((n + 1) % 3 === 0 && n + 1 < words.length ? '<i style="flex-basis:100%;height:0"></i>' : "");
    }).join(""));
    Object.assign(block.style, { left: `${i * PANEL_W + (PANEL_W - 1220) / 2}px`, top: `${top}px` });
    strip.appendChild(block);
  });
}

/* ════════════════════════════════════════════════════════════
   HERO (slide 1, V4): no phone.
   ════════════════════════════════════════════════════════════ */
/* The illustration (art/hero-illustration.png, drawn in code with anidoodle:
   art/dictusHero.ts) and where its voice line ends, in its own pixels. */
const ILLU = { src: `art/v7/hero-${CAST}.png`, w: 2640, h: 2000, panelIn: [1400, 1387] };
/* The waveform's centre in the recording capture (measured: blue bars from y 2052 to 2410). */
const CAPTURE_WAVE_Y = 2231;
/* The icon row along the very bottom of slides 1 and 2. */
const BAND = { ribbonY: 2735 };
const LIFTS = [];

/* App icons on the ribbon. Real icons are fetched by tools/fetch-icons.sh into the
   git-ignored .icons/ (third-party marks, never committed). The fallback draws
   neutral tiles in Dictus blues with simple writing glyphs. */
// V5 order (Pierre): Apple Messages and Mail included, AI chats added.
const RIBBON_APPS = ["messages", "whatsapp", "mail", "gmail", "chatgpt", "claude", "slack", "notion", "instagram", "linkedin", "messenger", "telegram", "outlook", "docs"];
const TILE_GLYPHS = [
  '<path d="M5 6h14v9H10l-5 4z"/>', '<path d="M4 7h16v11H4zM4 7l8 6 8-6"/>', '<path d="M7 4h7l4 4v12H7zM14 4v4h4M10 12h5M10 15h5"/>',
  '<circle cx="12" cy="12" r="3.5"/><path d="M15.5 12v1.5a2.5 2.5 0 0 0 5 0V12a8.5 8.5 0 1 0-3.4 6.8"/>', '<path d="M4 12l16-7-6 15-3-6z"/>', '<path d="M5 19l1-4L16 5l3 3L9 18z"/>',
];
const TILE_COLOURS = [["#3D7EFF", "#fff"], ["#DCE8FF", "#2563EB"], ["#0A1628", "#fff"], ["#6BA3FF", "#fff"], ["#2563EB", "#fff"], ["#EEF3FF", "#3D7EFF"]];
// A row along the very bottom of slides 1 and 2, below everything. startX puts icon 7
// exactly on the cut, straddling the two slides as in Wispr's set.
const ICON = { size: 128, step: 176, startX: PANEL_W - 7 * 176 };

function addRibbon() {
  RIBBON_APPS.forEach((slug, n) => {
    const x = ICON.startX + n * ICON.step, y = BAND.ribbonY + 16 * Math.sin(n * 1.3);
    const d = el("ribbon-icon");
    Object.assign(d.style, { left: `${x - ICON.size / 2}px`, top: `${y - ICON.size / 2}px`, width: `${ICON.size}px`, height: `${ICON.size}px`,
      transform: `rotate(${[-6, 4, -2, 7, -4][n % 5]}deg)` });
    if (RIBBON === "tiles") {
      const [bg, fg] = TILE_COLOURS[n % TILE_COLOURS.length];
      d.style.background = bg;
      d.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="${fg}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${TILE_GLYPHS[n % TILE_GLYPHS.length]}</svg>`;
    } else {
      d.innerHTML = `<img alt="" src=".icons/${slug}.png">`;
      d.querySelector("img").onerror = () => { document.getElementById("missing").innerHTML = "App icons missing<br>run: tools/fetch-icons.sh"; document.getElementById("missing").style.display = "flex"; };
    }
    strip.appendChild(d);
  });
}

/* The Dictus mark from assets/brand/appicon-dark.svg (#636): bars 9 wide, 18 / 42 / 27
   tall, capsule ends, 7.5 apart; centre bar #6BA3FF → #2563EB. On a light background
   the side bars are grey, as DictusLogo does in light mode. Never redrawn by hand. */
const LOGO_BARS = `<svg class="bars" viewBox="19 19 42 42"><defs><linearGradient id="hb" x1="0" y1="19" x2="0" y2="61" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6BA3FF"/><stop offset="1" stop-color="#2563EB"/></linearGradient></defs>
  <rect x="19" y="31" width="9" height="18" rx="4.5" fill="#8E8E93" opacity="0.45"/><rect x="35.5" y="19" width="9" height="42" rx="4.5" fill="url(#hb)"/><rect x="52" y="26" width="9" height="27" rx="4.5" fill="#8E8E93" opacity="0.65"/></svg>`;

function addHero(copy, i) {
  const brand = el("hero-brand", `${LOGO_BARS}<span>${S.wordmark}</span>`);
  brand.style.left = `${i * PANEL_W + 110}px`;
  strip.appendChild(brand);
  const h = el("hero-headline", copy.headline);
  h.style.left = `${i * PANEL_W + 110}px`;
  strip.appendChild(h);
  const img = document.createElement("img");
  img.className = "hero-illu"; img.id = "hero-illu"; img.alt = ""; img.src = ILLU.src;
  img.style.width = `${ILLU.w}px`;
  strip.appendChild(img);
  addRibbon();
}

SLIDES.forEach((s, i) => {
  const copy = S.slides[s.key];
  if (s.hero) { addHero(copy, i); return; }
  const headline = copy.headline ?? copy[VARIANT].headline;
  const c = el(`copy ${s.pro ? "pro-slide" : "free"}`, `
    <div class="badge-row">${s.pro ? `<span class="pro">${S.proBadge}</span>` : ""}</div>
    <div class="headline">${headline}</div>
    ${copy.footnote ? `<div class="footnote">${copy.footnote}</div>` : ""}`);
  c.style.left = `${i * PANEL_W}px`;
  strip.appendChild(c);
  let toStrip;
  if (s.phone) toStrip = addPhone(s.phone, i, s.pro);
  if (s.lift) addLift(s.lift, toStrip, s.phone.capture, s.pro, i);
  if (s.beforeAfter) addBeforeAfter(s.beforeAfter, copy, i, s.pro);
  if (s.keyboards) addKeyboards(s.keyboards, i, copy.labels);
  if (s.greetings) addGreetings(copy.greetings, i);
});

/* Place the hero canvas so the voice strokes end exactly at the left edge of slide 2's
   lifted recording panel, at the height of its waveform: they slip under the panel's
   edge there and the real waveform carries on inside it. */
{
  const lift = LIFTS[1], illu = document.getElementById("hero-illu");
  const waveY = lift.top + (CAPTURE_WAVE_Y - lift.band.y) * lift.k;
  Object.assign(illu.style, { left: `${lift.left + 6 - ILLU.panelIn[0]}px`, top: `${waveY - ILLU.panelIn[1]}px` });
}

/* ════════════════════════════════════════════════════════════
   Background + continuous waveform, drawn once across the strip.
   ════════════════════════════════════════════════════════════ */
const canvas = document.getElementById("bg");
canvas.width = STRIP_W; canvas.height = PANEL_H;
const ctx = canvas.getContext("2d");

/* Pro or not, per column: a clean change exactly at the cut (issue #643). */
const proAt = (x) => SLIDES[Math.min(Math.floor(x / PANEL_W), PANELS - 1)].pro;
const mix = (a, b, t) => a.map((v, k) => Math.round(v + (b[k] - v) * t));
SLIDES.forEach((s, i) => {
  const g = ctx.createLinearGradient(0, 0, 0, PANEL_H);
  g.addColorStop(0, `rgb(${s.pro ? T.proTop : FREE.top})`);
  g.addColorStop(1, `rgb(${s.pro ? T.proBottom : FREE.bottom})`);
  ctx.fillStyle = g;
  ctx.fillRect(i * PANEL_W, 0, PANEL_W, PANEL_H);
});
const DOT = 64;
for (let gy = DOT / 2; gy < PANEL_H; gy += DOT) {
  for (let gx = DOT / 2; gx < STRIP_W; gx += DOT) {
    ctx.fillStyle = proAt(gx) ? T.proDot : FREE.dot;
    ctx.beginPath(); ctx.arc(gx, gy, 2, 0, Math.PI * 2); ctx.fill();
  }
}

/* Waveform: BrandWaveform.swift processingEnergy,
     energy = 0.2 + 0.25 * (sin(2π · t) + 1)
   one continuous function over the whole strip. Colour follows the app's rule:
   the inner 40 % of every PANEL is the blue gradient, the rest fades to grey, so
   blue sits at each screen's centre and never on a seam. It runs behind the
   phones and shows in their margins, and in full on the slides without one. */
const BAR_W = 30, BAR_GAP = 16, MIN_H = 14, MAX_H = 640;
const WAVE_Y = 1600;
const WAVE_PERIOD = STRIP_W / 4;
const pitch = BAR_W + BAR_GAP;
const barFill = (x, y, h, cx) => {
  const p = Math.min(Math.floor(cx / PANEL_W), PANELS - 1);
  const dCenter = Math.abs(cx - (p * PANEL_W + PANEL_W / 2)) / (PANEL_W / 2);
  if (dCenter < 0.4) { const f = ctx.createLinearGradient(0, y, 0, y + h); f.addColorStop(0, "#6BA3FF"); f.addColorStop(1, "#2563EB"); return f; }
  const rgb = proAt(cx) ? T.proEdgeRGB : FREE.edgeRGB;
  return `rgba(${rgb},${((1 - dCenter) * 0.9 + 0.15).toFixed(3)})`;
};
ctx.globalAlpha = 0.62;
{
  // V6: on slides 1 and 2 the BrandWaveform lives only in the recording panel. The strip's
  // wave resumes in slide 2's right margin, at the height it keeps behind slides 3 to 7.
  const from = 2 * PANEL_W - (PANEL_W - 840) / 2;
  for (let x = from; x < STRIP_W - BAR_W; x += pitch) {
    const cx = x + BAR_W / 2;
    const energy = 0.2 + 0.25 * (Math.sin(2 * Math.PI * (cx / WAVE_PERIOD + 0.25)) + 1);
    const ramp = Math.min(1, 0.3 + (cx - from) / 260);
    const h = Math.max((MIN_H + energy * (MAX_H - MIN_H)) * ramp, MIN_H);
    const y = WAVE_Y - h / 2;
    ctx.beginPath(); ctx.roundRect(x, y, BAR_W, h, BAR_W / 2); ctx.fillStyle = barFill(x, y, h, cx); ctx.fill();
  }
}
ctx.globalAlpha = 1;

/* Signals the exporter waits for: every image decoded, fonts loaded, rows centred. */
window.whenReady = Promise.all([
  document.fonts.ready,
  ...[...document.images].map((im) => im.decode().catch(() => new Promise((r) => {
    im.addEventListener("load", r, { once: true });
    im.addEventListener("error", r, { once: true });
  }))),
]).then(() => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r))))
  .then(() => document.getElementById("missing").style.display !== "flex");
window.SLIDE_IDS = SLIDES.map((s) => s.id);
/* Design iteration: exports land in export/<locale>/<ITERATION>/ so earlier ones stay comparable. */
window.ITERATION = "v7";
/* Themes the exporter renders for this iteration (light only since V3, Pierre). */
window.EXPORT_THEMES = ["light"];
/* Variants: the first is the main set; the others re-export only the slides whose
   id they change, and get a montage-<name>.jpg of their own. */
window.VARIANTS = [
  { name: "woman-curves", query: "cast=woman-curves" },
  { name: "woman", query: "cast=woman" },
  { name: "man", query: "cast=man" },
];
/* V7 changes slide 1: Pierre validated slides 2 to 7 as exported in V6. Slides 3 to 7 are
   reused from there. Slide 2 is re-rendered per character only because the voice strokes
   cross the cut and end on it (the last ~80 px before the panel), and they follow each
   character's mouth; everything else on slide 2 is V6's. */
window.EXPORT_SLIDES = [0, 1];
window.REUSE_FROM = "v6";
/* Per character: slides 1 and 2 side by side, 1400 px wide; and one sheet of the slide 1s. */
window.PAIR = { slides: [0, 1], width: 1400, file: "slides-1-2-{name}.jpg", everyVariant: true };
window.SHEET = { slide: 0, file: "characters.jpg" };

if (params.has("preview")) {
  document.body.classList.add("preview");
  const fit = () => {
    const scale = (window.innerWidth - 48) / STRIP_W;
    strip.style.transform = `scale(${scale})`;
    document.body.style.height = `${PANEL_H * scale + 60}px`;
  };
  fit();
  window.addEventListener("resize", fit);
}
</script>
</body>
</html>
