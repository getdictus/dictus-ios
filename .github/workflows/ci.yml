name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    # Pin the SwiftLint version so a rule change in a new release lands in a
    # deliberate PR rather than turning CI red on unrelated work. Keep in sync
    # with local runs (brew install swiftlint).
    container:
      image: ghcr.io/realm/swiftlint:0.63.2
    steps:
      - uses: actions/checkout@v4

      # --strict: every violation fails CI. There is no baseline or exemption
      # file — see the header of .swiftlint.yml (issue #146).
      - name: Run SwiftLint (strict)
        run: swiftlint lint --strict --reporter github-actions-logging

  build:
    name: Build (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Xcode 26.4.1, the local development toolchain, as the original 26.3 pin intended
      # ("match the local development environment"). It also became load-bearing with
      # #558: `project.pbxproj` sets `traits = ()` on FluidAudio to keep its default
      # NemoTextProcessing trait unlinked. Xcode 26.3 ignores that key, links the trait's
      # static library, and the library's simulator slice is arm64-only, so the x86_64
      # half of this generic simulator build fails to link. 26.4.1 honours the key, which
      # is also what the device and TestFlight builds are made with. The macos-26 image
      # ships 26.0.1 through 26.6 (actions/runner-images, image 20260907).
      - name: Select Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcbeautify (if missing)
        run: |
          if ! command -v xcbeautify >/dev/null 2>&1; then
            brew install xcbeautify
          fi

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          # `fa015` in both keys (#558): a SwiftPM cache that resolved FluidAudio 0.12 makes
          # resolution fail on 0.15.7 with "Disabled default traits … on package 'fluidaudio'
          # that declares no traits" (measured on a local checkout). The prefix keeps any
          # cache from before the bump from being restored.
          key: spm-fa015-${{ runner.os }}-${{ hashFiles('Dictus.xcodeproj/project.pbxproj', 'DictusCore/Package.swift') }}
          restore-keys: |
            spm-fa015-${{ runner.os }}-

      - name: Resolve SwiftPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Dictus.xcodeproj \
            -scheme DictusApp

      - name: Build DictusApp (and embedded Keyboard, Widgets, Core)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Dictus.xcodeproj \
            -scheme DictusApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            | xcbeautify --renderer github-actions

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            build/DerivedData/Logs/Build
          retention-days: 7
          if-no-files-found: ignore

  # The DictusCore suite, run with the repository's one canonical test command (#534).
  # PR descriptions — increasingly written by agents — report `swift test` results;
  # this job replays that claim instead of trusting it. It is its own job, not a step
  # of `build`, so a red test is reported as a test failure rather than folded into a
  # compilation failure, and a green build or lint cannot mask it.
  test:
    name: DictusCore Tests
    # macOS, no simulator: the suite runs on the Mac directly. The iOS Simulator
    # destination passes too since #301 but executes exactly the same tests while
    # paying for a simulator boot (CLAUDE.md, "Build, test, lint").
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      # On a pull request, test the PR's head commit itself rather than the
      # `refs/pull/N/merge` commit checkout defaults to, so the result reported on
      # that SHA is a result FOR that SHA. Branch protection is strict (the branch
      # must be up to date with its base before merging), so the merge-ref check
      # would add nothing the head-SHA check does not already cover at merge time.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Show tested commit
        run: git rev-parse HEAD

      # Same toolchain as the build job, for the same reasons (see its comment).
      - name: Select Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Polish grounding (#414) finds names with NLTagger's `.nameType` scheme, and
      # the suite asserts on what it finds in French. That scheme needs a per-language
      # Natural Language asset that macOS downloads on demand. The runner image is an
      # en_US install that carries it for English only — measured on macos-26 / 26.6.2:
      # `availableTagSchemes` for French and German was [Language, Script, TokenType],
      # and eight French grounding tests failed on an empty name list. A Mac set up in
      # French has the asset, which is why the same tests pass locally.
      #
      # So fetch the asset for every `SupportedLanguage` before testing, and fail HERE,
      # with a message, if it cannot be had — a missing asset must not read as a
      # grounding regression in the test step below.
      - name: Install Natural Language name-tagging assets
        run: |
          cat > "$RUNNER_TEMP/nl-assets.swift" <<'SWIFT'
          import Foundation
          import NaturalLanguage

          var missing: [String] = []
          for code in ["fr", "en", "es", "de"] {
              let language = NLLanguage(rawValue: code)
              var outcome: String?
              NLTagger.requestAssets(for: language, tagScheme: .nameType) { result, error in
                  switch result {
                  case .available: outcome = "available"
                  case .notAvailable: outcome = "not available"
                  case .error: outcome = "error: \(error.map { "\($0)" } ?? "unknown")"
                  @unknown default: outcome = "unknown result"
                  }
              }
              // Spin the main run loop rather than block on a semaphore. Measured on
              // this runner: the semaphore version printed nothing for ten minutes
              // until it was cancelled; this one fetched all four in about 30 s. The
              // likeliest reason is a completion delivered on the main queue, which
              // a blocked main thread never runs — inferred, not confirmed.
              let deadline = Date().addingTimeInterval(120)
              while outcome == nil && Date() < deadline {
                  RunLoop.main.run(until: Date().addingTimeInterval(0.5))
              }
              let ready = NLTagger.availableTagSchemes(for: .word, language: language).contains(.nameType)
              print("\(code): requestAssets -> \(outcome ?? "timed out"); nameType available: \(ready)")
              if !ready { missing.append(code) }
          }
          if !missing.isEmpty {
              print("::error::NLTagger nameType asset missing for \(missing). DictusCore grounding tests would fail for an environment reason, not a code one.")
              exit(1)
          }
          SWIFT
          swift "$RUNNER_TEMP/nl-assets.swift"

      # No SwiftPM cache here, deliberately. DictusCore/Package.swift declares no
      # package dependencies, so `swift test` fetches nothing — there is nothing a
      # dependency cache could save. Caching `.build` instead would trade a minute of
      # compilation for the risk of testing stale artifacts, which is the one thing
      # this check exists to rule out.
      #
      # #560: on a Mac, `AppGroup.containerURL` is nil for an unentitled process like
      # the test host, so nothing here touches a Group Container — on the runner or
      # on a developer machine.
      - name: Run DictusCore tests (swift test)
        working-directory: DictusCore
        run: swift test

  # The DictusApp unit tests (#900), today the SKTestSession test of a lifetime bought
  # outside the app. Its own job, like `test`, so a red test reads as a test failure.
  # It cannot live in `test`: under `swift test` on macOS SKTestSession refuses the
  # purchase with `notEntitled`, so it needs an app host on a simulator.
  app-tests:
    name: App Tests (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Same toolchain as the build job, for the same reasons (see its comment).
      - name: Select Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          # Same keys as the build job (see its comment on `fa015`).
          key: spm-fa015-${{ runner.os }}-${{ hashFiles('Dictus.xcodeproj/project.pbxproj', 'DictusCore/Package.swift') }}
          restore-keys: |
            spm-fa015-${{ runner.os }}-

      - name: Resolve SwiftPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Dictus.xcodeproj \
            -scheme DictusApp

      # What the image offers, so the log shows why the next step chose what it chose.
      - name: Show installed Xcodes and iOS runtimes
        run: |
          ls -d /Applications/Xcode*.app
          xcrun simctl list runtimes

      # SKTestSession is broken on the iOS 26.3 to 26.5 simulator runtimes: every call
      # fails with SKInternalErrorDomain 3 and `buyProduct` throws `notEntitled`
      # (FB22237318 and public reports; measured here on 26.4.1 in CI and on 26.5
      # locally, while 27.2 passes locally). So:
      # - B: an Xcode 27 with an iOS 27 runtime on the image, used for this job only;
      # - A, otherwise: Xcode 26.4.1 kept, an iPhone on the iOS 26.2 runtime the image
      #   ships. Nothing is installed; no such iPhone fails here, by name.
      - name: Pick Xcode and simulator for SKTestSession
        run: |
          XCODE27=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | tail -1 || true)
          if [ -n "$XCODE27" ] && xcrun simctl list runtimes available | grep -q "^iOS 27\."; then
            echo "Option B: $XCODE27 with an iOS 27 runtime"
            sudo xcode-select -s "$XCODE27"
            xcodebuild -version
            WANT=27
          else
            echo "Option A: no Xcode 27 with an iOS 27 runtime; Xcode 26.4.1 and iOS 26.2"
            WANT=26.2
          fi
          xcrun simctl list -j runtimes available > "$RUNNER_TEMP/runtimes.json"
          xcrun simctl list -j devices available > "$RUNNER_TEMP/devices.json"
          PICK=$(python3 - "$WANT" "$RUNNER_TEMP/runtimes.json" "$RUNNER_TEMP/devices.json" <<'PY'
          import json, sys
          want, runtimes_path, devices_path = sys.argv[1:4]
          prefix = want.split(".")
          runtimes = [r for r in json.load(open(runtimes_path))["runtimes"]
                      if r.get("platform") == "iOS" and r["version"].split(".")[:len(prefix)] == prefix]
          devices = json.load(open(devices_path))["devices"]
          for runtime in sorted(runtimes, key=lambda r: [int(x) for x in r["version"].split(".")], reverse=True):
              phones = [d for d in devices.get(runtime["identifier"], [])
                        if d["name"].startswith("iPhone") and d.get("isAvailable", True)]
              if phones:
                  phone = sorted(phones, key=lambda d: d["name"])[-1]
                  print(phone["udid"], runtime["version"], phone["name"], sep="|")
                  break
          PY
          )
          if [ -z "$PICK" ]; then
            echo "::error::No available iPhone simulator on an iOS $WANT runtime. SKTestSession fails on iOS 26.3 to 26.5 (SKInternalErrorDomain 3), so no other runtime is taken."
            exit 1
          fi
          IFS='|' read -r UDID RUNTIME NAME <<<"$PICK"
          echo "Simulator: $NAME, iOS $RUNTIME, $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      # Raw xcodebuild output in a file, filtered on screen: xcbeautify would rewrite
      # the "Test Case ... passed" lines the next step looks for.
      - name: Run DictusAppTests (xcodebuild test)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Dictus.xcodeproj \
            -scheme DictusApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            -only-testing:DictusAppTests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 180 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            2>&1 | tee "$RUNNER_TEMP/app-tests.log" \
            | grep -E --line-buffered "error:|Test Case|Executed|\*\* |Testing failed|hung"

      - name: Show the SubscriptionForegroundRefreshTests result
        run: grep -E "Test Case .*SubscriptionForegroundRefreshTests.* passed" "$RUNNER_TEMP/app-tests.log"

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-tests-log
          path: ${{ runner.temp }}/app-tests.log
          retention-days: 7
          if-no-files-found: ignore
